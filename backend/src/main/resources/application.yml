server:
  port: 8080

spring:
  application:
    name: gongwen-assistant
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gongwen}
    username: ${SPRING_DATASOURCE_USERNAME:gongwen}
    password: ${SPRING_DATASOURCE_PASSWORD:gongwen_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

gongwen:
  material:
    storage-dir: ${GONGWEN_MATERIAL_STORAGE_DIR:storage/materials}
    max-file-size-bytes: ${GONGWEN_MATERIAL_MAX_FILE_SIZE_BYTES:20971520}
