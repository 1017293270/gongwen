server:
  port: 8080

spring:
  application:
    name: gongwen-assistant
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gongwen}
    username: ${SPRING_DATASOURCE_USERNAME:gongwen}
    password: ${SPRING_DATASOURCE_PASSWORD:gongwen_dev_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

gongwen:
  template:
    storage-dir: ${GONGWEN_TEMPLATE_STORAGE_DIR:storage/templates}
    max-upload-mb: ${GONGWEN_TEMPLATE_MAX_UPLOAD_MB:20}
  material:
    storage-dir: ${GONGWEN_MATERIAL_STORAGE_DIR:storage/materials}
    max-file-size-bytes: ${GONGWEN_MATERIAL_MAX_FILE_SIZE_BYTES:20971520}
  export:
    storage-dir: ${GONGWEN_EXPORT_STORAGE_DIR:storage/exports}
  render-preview:
    storage-dir: ${GONGWEN_RENDER_PREVIEW_STORAGE_DIR:storage/previews}
    renderer: ${GONGWEN_RENDER_PREVIEW_RENDERER:libreoffice}
    libre-office-path: ${GONGWEN_LIBREOFFICE_PATH:soffice}
    dpi: ${GONGWEN_RENDER_PREVIEW_DPI:150}
    timeout-seconds: ${GONGWEN_RENDER_PREVIEW_TIMEOUT_SECONDS:60}
  security:
    bootstrap-admin:
      username: ${GONGWEN_BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${GONGWEN_BOOTSTRAP_ADMIN_PASSWORD:}
  ai:
    provider: ${GONGWEN_AI_PROVIDER:mock}
    settings-key-file: ${GONGWEN_AI_SETTINGS_KEY_FILE:storage/ai-settings.key}
    deepseek:
      enabled: ${GONGWEN_DEEPSEEK_ENABLED:false}
      base-url: ${GONGWEN_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      model: ${GONGWEN_DEEPSEEK_MODEL:deepseek-v4-flash}
      api-key: ${DEEPSEEK_API_KEY:}
      timeout-seconds: ${GONGWEN_DEEPSEEK_TIMEOUT_SECONDS:60}
